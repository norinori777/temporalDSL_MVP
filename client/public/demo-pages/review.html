<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登録内容の確認 | Fieldnote</title>
    <style>
      :root { color-scheme: light; font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif; color: #332f2b; background: #f5f3ef; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; }
      header { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 max(22px, calc((100vw - 760px) / 2)); border-bottom: 1px solid #e7dfd8; background: #fff; color: #493a31; font-size: 11px; font-weight: 700; }
      header small { display: block; margin-top: 3px; color: #999188; font-family: Consolas, monospace; font-size: 8px; font-weight: 400; }
      .mark { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 5px; background: #b76345; color: #fff; font: 16px Georgia, serif; }
      .dept { margin-left: auto; color: #999188; font: 8px Consolas, monospace; }
      main { width: min(650px, calc(100% - 36px)); margin: 0 auto; padding: 38px 0 26px; }
      .eyebrow { color: #ad7055; font: 9px Consolas, monospace; }
      h1 { margin: 10px 0 8px; color: #3f332e; font: 500 28px/1.3 Georgia, "Yu Mincho", serif; }
      .lead { max-width: 540px; margin: 0; color: #78716b; font-size: 12px; line-height: 1.9; }
      .status { display: flex; align-items: center; gap: 8px; margin-top: 22px; padding: 12px 0; border-bottom: 1px solid #e7dfd8; color: #9b6248; font-size: 11px; font-weight: 600; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #d18a54; }
      .request { margin-left: auto; color: #99918a; font: 8px Consolas, monospace; }
      .details > div { min-height: 49px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid #e7dfd8; }
      .details span { color: #7e776f; font-size: 10px; }
      .details strong { color: #413a35; font-size: 11px; font-weight: 600; text-align: right; }
      .note { margin-top: 18px; padding: 13px 14px; background: #f0e9e2; }
      .note strong { color: #895840; font-size: 10px; }
      .note p { margin: 6px 0 0; color: #776e66; font-size: 10px; line-height: 1.8; }
      footer { margin-top: 24px; color: #9a928a; font: 8px Consolas, monospace; }
      @media (max-width: 520px) { header { height: 52px; padding-inline: 15px; } main { padding-top: 29px; } h1 { font-size: 24px; } }
    </style>
  </head>
  <body>
    <header><span class="mark">F</span><span>FIELDNOTE<small>ACCOUNT SERVICES</small></span><span class="dept">SECURE REVIEW</span></header>
    <main>
      <div class="eyebrow">ACCOUNT / REVIEW</div>
      <h1>登録内容をご確認ください</h1>
      <p class="lead">ご利用開始に向けて、以下の内容に誤りがないかご確認ください。</p>
      <div class="status"><span class="dot"></span>確認待ち<span class="request">REQUEST FN-5812</span></div>
      <div class="details">
        <div><span>お申し込み</span><strong>チームプラン</strong></div>
        <div><span>利用拠点</span><strong>東京オフィス</strong></div>
        <div><span>利用開始日</span><strong>2026年10月15日</strong></div>
      </div>
      <aside class="note"><strong>確認事項</strong><p>内容に相違がある場合は、担当窓口までご連絡ください。確認後、次の手続きへ進みます。</p></aside>
      <footer>FIELDNOTE · ACCOUNT OPERATIONS</footer>
    </main>
  </body>
</html>
